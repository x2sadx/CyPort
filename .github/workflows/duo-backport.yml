name: Build v1.3 with iPhone Duo support

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the published releases
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o v1.3.ipa "https://github.com/Thijs2004/CyPort/releases/download/v1.3/CyPort-unsigned.ipa"
          curl -fL --retry 3 -o v1.4.ipa "https://github.com/Thijs2004/CyPort/releases/download/v1.4/CyPort-1.4.0.ipa"
          echo "v1.3 SHA256: $(sha256sum v1.3.ipa | cut -d' ' -f1)"
          echo "v1.4 SHA256: $(sha256sum v1.4.ipa | cut -d' ' -f1)"

      - name: Backport the v1.4 Duo runtime into the v1.3 app
        shell: bash
        run: |
          set -euo pipefail
          mkdir old new out
          unzip -q v1.3.ipa -d old
          unzip -q v1.4.ipa -d new
          python3 <<'PY'
          import glob, os, plistlib, shutil, struct

          def app(root):
              hits = glob.glob(root + "/Payload/*.app")
              if len(hits) != 1:
                  raise SystemExit(f"Expected exactly one app in {root}; found {hits}")
              return hits[0]

          old, new = app("old"), app("new")

          def need(path):
              if not os.path.isfile(path):
                  raise SystemExit("Required release component missing: " + path)
              return path

          old_exe = need(old + "/Cyberpunk2077")
          new_exe = need(new + "/Cyberpunk2077")
          old_shim = need(old + "/Frameworks/libMacShim.dylib")
          new_shim = need(new + "/Frameworks/libMacShim.dylib")

          def macho(path):
              data = open(path, "rb").read(4096)
              # Thin 64-bit Mach-O, little-endian. These releases target arm64 iOS.
              if data[:4] != b"\xcf\xfa\xed\xfe":
                  raise SystemExit(f"Unexpected/non-thin Mach-O header: {path}")
              cpu = struct.unpack_from("<I", data, 4)[0]
              if cpu != 0x0100000c:
                  raise SystemExit(f"Expected arm64 Mach-O, got CPU 0x{cpu:08x}: {path}")
              return data

          def sdk_version(path):
              with open(path, "rb") as f:
                  data = f.read()
              ncmds = struct.unpack_from("<I", data, 16)[0]
              off = 32
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from("<II", data, off)
                  if size < 8 or off + size > len(data):
                      raise SystemExit("Malformed Mach-O load command: " + path)
                  if cmd == 0x32:  # LC_BUILD_VERSION
                      sdk = struct.unpack_from("<I", data, off + 12)[0]
                      return (sdk >> 16, (sdk >> 8) & 0xff, sdk & 0xff)
                  off += size
              raise SystemExit("v1.4 starter has no LC_BUILD_VERSION SDK stamp.")

          old_exe_head = macho(old_exe)
          new_exe_head = macho(new_exe)
          old_shim_head = macho(old_shim)
          new_shim_head = macho(new_shim)
          sdk = sdk_version(new_exe)
          if sdk[0] < 27:
              raise SystemExit(f"v1.4 starter SDK is {sdk}, not the iOS 27+ SDK required for Duo real-screen sizing.")

          shim_data = open(new_shim, "rb").read()
          exe_data = open(new_exe, "rb").read()
          if b"MSSceneDelegate" not in shim_data:
              raise SystemExit("v1.4 libMacShim lacks MSSceneDelegate; refusing to package.")
          if b"iPhone19,4" not in shim_data:
              raise SystemExit("v1.4 shim lacks the iPhone Duo hardware/layout target.")
          if b"@rpath/libMacShim.dylib" not in exe_data and b"libMacShim.dylib" not in exe_data:
              raise SystemExit("v1.4 starter does not reference libMacShim.dylib.")

          # Use the matching v1.4 starter + shim as a pair. Do not mix the v1.3 starter
          # with a scene-based shim: the iOS 27 scene lifecycle is an inseparable pair.
          shutil.copy2(new_exe, old_exe)
          shutil.copy2(new_shim, old_shim)

          # Keep v1.3's bundle identity, game assets, data, and game dylibs. Copy only
          # the v1.4 metadata needed by the scene-based Duo runtime.
          old_plist, new_plist = old + "/Info.plist", new + "/Info.plist"
          with open(old_plist, "rb") as f:
              info = plistlib.load(f)
          with open(new_plist, "rb") as f:
              ref = plistlib.load(f)

          required_keys = (
              "UIApplicationSceneManifest",
              "UISupportedInterfaceOrientations",
              "UISupportedInterfaceOrientations~ipad",
              "UIApplicationSupportsIndirectInputEvents",
              "DTPlatformName",
              "DTPlatformVersion",
              "DTSDKName",
          )
          for key in required_keys:
              if key not in ref:
                  raise SystemExit(f"v1.4 Info.plist is missing required Duo key: {key}")
              info[key] = ref[key]
          # Build-number fields are optional across Xcode releases; copy them when present.
          for key in ("DTSDKBuild", "DTPlatformBuild"):
              if key in ref:
                  info[key] = ref[key]

          scene = info["UIApplicationSceneManifest"]
          configs = scene.get("UISceneConfigurations", {})
          app_configs = configs.get("UIWindowSceneSessionRoleApplication", [])
          if not any(c.get("UISceneDelegateClassName") == "MSSceneDelegate" for c in app_configs):
              raise SystemExit("Merged Info.plist does not register MSSceneDelegate for the app scene.")

          original_id = info.get("CFBundleIdentifier")
          original_version = info.get("CFBundleShortVersionString")
          with open(old_plist, "wb") as f:
              plistlib.dump(info, f, fmt=plistlib.FMT_XML, sort_keys=False)

          # Sanity check the merged bundle before packaging.
          with open(old_plist, "rb") as f:
              checked = plistlib.load(f)
          assert checked.get("CFBundleIdentifier") == original_id
          assert checked.get("CFBundleShortVersionString") == original_version
          assert os.path.getsize(old_exe) > 0 and os.path.getsize(old_shim) > 0
          print("Retained v1.3 bundle ID/version:", original_id, original_version)
          print("Installed matched v1.4 arm64 starter + scene/Duo shim; SDK:", sdk)
          print("Merged v1.4 scene manifest, orientation, and SDK metadata.")
          print("Retained v1.3 game data/resources and all other game libraries.")

          PY
          (cd old && zip -qry ../out/CyPort-v1.3-Duo-unsigned.ipa Payload)
          unzip -tq out/CyPort-v1.3-Duo-unsigned.ipa
          test -s out/CyPort-v1.3-Duo-unsigned.ipa
          sha256sum out/CyPort-v1.3-Duo-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CyPort-v1.3-Duo-unsigned
          path: out/CyPort-v1.3-Duo-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
